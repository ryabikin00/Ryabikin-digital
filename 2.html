<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд селлера — WB + Ozon</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0a0f;--panel:#14141c;--panel-2:#1c1c28;--border:#2a2a38;--text:#f5f5f7;--muted:#a1a1aa;--accent:#8b5cf6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--wb:#cb11ab;--oz:#005bff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:24px;}
.wrap{max-width:1280px;margin:0 auto;}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.top h1{font-size:1.5rem;}
.top h1 span{color:var(--accent);}
.tabs{display:flex;gap:8px;background:var(--panel);padding:6px;border-radius:12px;border:1px solid var(--border);}
.tab{padding:8px 18px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;font-size:.9rem;transition:all .2s;font-family:inherit;}
.tab:hover{color:var(--text);}
.tab.active{background:var(--accent);color:#fff;}
.tab.wb.active{background:var(--wb);}
.tab.oz.active{background:var(--oz);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;}
.card .label{color:var(--muted);font-size:.85rem;margin-bottom:8px;}
.card .val{font-size:1.7rem;font-weight:700;}
.card .delta{font-size:.85rem;margin-top:6px;}
.delta.up{color:var(--green);}.delta.down{color:var(--red);}
h2{font-size:1.05rem;margin-bottom:16px;color:var(--muted);font-weight:500;}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
.flow-step{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.flow-step .num{font-size:1.6rem;font-weight:700;color:var(--accent);}
.flow-step .lbl{font-size:.78rem;color:var(--muted);margin-top:4px;}
.flow-step.bad .num{color:var(--red);}
.flow-step.warn .num{color:var(--amber);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
@media(max-width:900px){.two{grid-template-columns:1fr;}}
.wh-list,.ship-list{display:flex;flex-direction:column;gap:10px;}
.wh,.ship{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;}
.wh .plat,.ship .plat{font-size:.7rem;padding:2px 6px;border-radius:4px;font-weight:700;margin-left:6px;color:#fff;}
.plat.wb{background:var(--wb);}.plat.oz{background:var(--oz);}
.wh b{font-size:1.05rem;color:var(--accent);}
.wh.low b{color:var(--red);}.wh.warn b{color:var(--amber);}
.ship .meta{color:var(--muted);font-size:.78rem;margin-top:2px;}
.status{padding:3px 8px;border-radius:6px;font-size:.72rem;font-weight:600;white-space:nowrap;}
.status.ok{background:rgba(34,197,94,.15);color:var(--green);}
.status.warn{background:rgba(245,158,11,.15);color:var(--amber);}
.status.bad{background:rgba(239,68,68,.15);color:var(--red);}
.chart-box{position:relative;height:240px;}
.progress-item{margin-bottom:14px;}
.progress-item .row{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px;}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa);border-radius:3px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🛒 Кабинет селлера <span>· Aurora</span></h1>
    <div class="tabs">
      <button class="tab active" data-tab="all">Все</button>
      <button class="tab wb" data-tab="wb">Wildberries</button>
      <button class="tab oz" data-tab="ozon">Ozon</button>
    </div>
  </div>

  <div class="grid" id="topCards"></div>

  <h2>Поток заказов сегодня</h2>
  <div class="flow" id="flow"></div>

  <div class="two">
    <div class="card">
      <h2>Остатки по складам</h2>
      <div class="wh-list" id="warehouses"></div>
    </div>
    <div class="card">
      <h2>Товары в пути</h2>
      <div class="ship-list" id="inTransit"></div>
    </div>
  </div>

  <div class="two">
    <div class="card">
      <h2>Топ товаров по продажам</h2>
      <div id="topProducts"></div>
    </div>
    <div class="card">
      <h2>Продажи за 7 дней</h2>
      <div class="chart-box"><canvas id="salesChart"></canvas></div>
    </div>
  </div>
</div>

<script>
const DATA = {
  all: {
    ordersToday: 87, revenueToday: 142500, profit: 43200, returns: 3,
    flow: {processing:34, delivery:28, delivered:25, back:5, returns:3},
    warehouses: [
      {name:'Коледино', plat:'WB', qty:234, status:'ok'},
      {name:'Хоругвино', plat:'Ozon', qty:156, status:'ok'},
      {name:'Электросталь', plat:'WB', qty:89, status:'warn'},
      {name:'Пушкино', plat:'Ozon', qty:32, status:'low'},
    ],
    inTransit: [
      {name:'Футболка oversize, 20 шт', plat:'WB', dest:'Коледино', date:'02.11', status:'ok', statusText:'в пути'},
      {name:'Кружка керамич., 15 шт', plat:'Ozon', dest:'Хоругвино', date:'03.11', status:'ok', statusText:'в пути'},
      {name:'Наушники TWS, 10 шт', plat:'Ozon', dest:'Пушкино', date:'задержка 2 дня', status:'warn', statusText:'задержка'},
      {name:'Чехол iPhone 15, 30 шт', plat:'WB', dest:'Электросталь', date:'прибыл', status:'ok', statusText:'доставлено'},
    ],
    topProducts: [
      {name:'Футболка oversize', pct:38, qty:33},
      {name:'Чехол iPhone 15', pct:26, qty:23},
      {name:'Кружка керамич.', pct:18, qty:16},
      {name:'Наушники TWS', pct:12, qty:10},
      {name:'Другое', pct:6, qty:5},
    ],
    chart: [72,68,81,89,95,78,87]
  },
  wb: {
    ordersToday: 52, revenueToday: 82500, profit: 25100, returns: 1,
    flow: {processing:20, delivery:18, delivered:13, back:3, returns:1},
    warehouses: [
      {name:'Коледино', plat:'WB', qty:234, status:'ok'},
      {name:'Электросталь', plat:'WB', qty:89, status:'warn'},
    ],
    inTransit: [
      {name:'Футболка oversize, 20 шт', plat:'WB', dest:'Коледино', date:'02.11', status:'ok', statusText:'в пути'},
      {name:'Чехол iPhone 15, 30 шт', plat:'WB', dest:'Электросталь', date:'прибыл', status:'ok', statusText:'доставлено'},
    ],
    topProducts: [
      {name:'Футболка oversize', pct:48, qty:25},
      {name:'Чехол iPhone 15', pct:30, qty:16},
      {name:'Другое', pct:22, qty:11},
    ],
    chart: [42,38,49,54,58,47,52]
  },
  ozon: {
    ordersToday: 35, revenueToday: 60000, profit: 18100, returns: 2,
    flow: {processing:14, delivery:10, delivered:12, back:2, returns:2},
    warehouses: [
      {name:'Хоругвино', plat:'Ozon', qty:156, status:'ok'},
      {name:'Пушкино', plat:'Ozon', qty:32, status:'low'},
    ],
    inTransit: [
      {name:'Кружка керамич., 15 шт', plat:'Ozon', dest:'Хоругвино', date:'03.11', status:'ok', statusText:'в пути'},
      {name:'Наушники TWS, 10 шт', plat:'Ozon', dest:'Пушкино', date:'задержка 2 дня', status:'warn', statusText:'задержка'},
    ],
    topProducts: [
      {name:'Кружка керамич.', pct:40, qty:14},
      {name:'Наушники TWS', pct:29, qty:10},
      {name:'Другое', pct:31, qty:11},
    ],
    chart: [30,30,32,35,37,31,35]
  }
};

const fmt = n => n.toLocaleString('ru-RU');

function render(key){
  const d = DATA[key];

  document.getElementById('topCards').innerHTML = `
    <div class="card"><div class="label">Заказы сегодня</div><div class="val">${d.ordersToday}</div><div class="delta up">↑ активность</div></div>
    <div class="card"><div class="label">Выручка сегодня</div><div class="val">${fmt(d.revenueToday)} ₽</div><div class="delta up">↑ рост</div></div>
    <div class="card"><div class="label">Прибыль</div><div class="val">${fmt(d.profit)} ₽</div><div class="delta up">маржа ${Math.round(d.profit/d.revenueToday*100)}%</div></div>
    <div class="card"><div class="label">Возвраты</div><div class="val" style="color:var(--red)">${d.returns}</div><div class="delta down">выше нормы</div></div>
  `;

  document.getElementById('flow').innerHTML = `
    <div class="flow-step"><div class="num">${d.flow.processing}</div><div class="lbl">В обработке</div></div>
    <div class="flow-step"><div class="num">${d.flow.delivery}</div><div class="lbl">В доставке</div></div>
    <div class="flow-step"><div class="num">${d.flow.delivered}</div><div class="lbl">Доставлено</div></div>
    <div class="flow-step warn"><div class="num">${d.flow.back}</div><div class="lbl">Едет обратно</div></div>
    <div class="flow-step bad"><div class="num">${d.flow.returns}</div><div class="lbl">Возвраты</div></div>
  `;

  document.getElementById('warehouses').innerHTML = d.warehouses.map(w => `
    <div class="wh ${w.status==='low'?'low':w.status==='warn'?'warn':''}">
      <div>${w.name}<span class="plat ${w.plat==='WB'?'wb':'oz'}">${w.plat}</span></div>
      <b>${w.qty} шт</b>
    </div>
  `).join('');

  document.getElementById('inTransit').innerHTML = d.inTransit.map(s => `
    <div class="ship">
      <div>
        <div>${s.name}</div>
        <div class="meta">→ ${s.dest} · ${s.date} <span class="plat ${s.plat==='WB'?'wb':'oz'}">${s.plat}</span></div>
      </div>
      <span class="status ${s.status}">${s.statusText}</span>
    </div>
  `).join('');

  document.getElementById('topProducts').innerHTML = d.topProducts.map(p => `
    <div class="progress-item">
      <div class="row"><span>${p.name}</span><span>${p.pct}% · ${p.qty} шт</span></div>
      <div class="bar"><div style="width:${p.pct}%"></div></div>
    </div>
  `).join('');

  if (window._chart) window._chart.destroy();
  window._chart = new Chart(document.getElementById('salesChart'), {
    type:'line',
    data:{
      labels:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],
      datasets:[{
        label:'Заказы', data:d.chart,
        borderColor:'#8b5cf6', backgroundColor:'rgba(139,92,246,0.15)',
        fill:true, tension:0.4, pointRadius:4, pointBackgroundColor:'#8b5cf6'
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:'#2a2a38'},ticks:{color:'#a1a1aa'}},
        y:{grid:{color:'#2a2a38'},ticks:{color:'#a1a1aa'},beginAtZero:true}
      }
    }
  });
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tab);
  });
});

render('all');
</script>
</body>
</html>
